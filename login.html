<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>User Login</title>

    <link rel="stylesheet" href="login.css">
</head>

<body>

    <div class="login-box">

        <div class="login-image">
            <img src="WhatsApp Image 2026-09-13 at 5.50.41 PM.jpeg" alt="Login">
        </div>

        <h1>اكتبي ي حبيبتي💗🌎💗💗💗🌎💗</h1>

        <input
            type="text"
            id="username"
            placeholder="username"
        >

        <input
            type="password"
            id="password"
            placeholder="password"
        >

        <p class="forgot">منقدرش ننسا الباسورد😂؟</p>

        <button id="loginBtn">
            اضغطي ي قلبي💗💗
        </button>

        <p id="errorMessage"></p>

    </div>

    <div id="welcome" class="welcome">
        <h1>أهلاً بيكي ❤️</h1>
        <p>نورتي عالمنا الجميل 💗</p>
    </div>

    <script src="login.js"></script>

</body>

</html>
