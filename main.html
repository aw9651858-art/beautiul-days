<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>💗 Beautiful Days 💗</title>

    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        audio {
            display: none;
        }
    </style>
</head>

<body>

    <!-- الأغنية الأساسية 🎵 -->
    <audio id="loveMusic" loop preload="auto">
        <source src="./love-song.mp3" type="audio/mpeg">
    </audio>


    <!-- الصفحات -->
    <iframe id="pageFrame" src="start.html"></iframe>


    <script>

        const music =
            document.getElementById("loveMusic");

        const frame =
            document.getElementById("pageFrame");


        // تشغيل الأغنية 🎵

        function playLoveMusic() {

            music.volume = 1;
            music.muted = false;

            music.play()
                .catch(function (error) {

                    console.log("Music Error:", error);

                });

        }


        // تشغيل / إيقاف الأغنية

        function toggleLoveMusic() {

            if (music.paused) {

                playLoveMusic();

            } else {

                music.pause();

            }

        }


        // الانتقال إلى Project ❤️

        function goToProject() {

            frame.src = "project.html";

        }


        // استقبال أمر Next من start.html

        window.addEventListener("message", function (event) {

            if (event.data === "GO_TO_PROJECT") {

                goToProject();

            }

        });

    </script>

</body>

</html>
